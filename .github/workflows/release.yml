# Релиз: тег v* (или ручной запуск) — сборка Visink для macOS и Windows, выкладка в GitHub Release
# и latest.json для автообновления (сборки подписаны ключом из секрета TAURI_SIGNING_PRIVATE_KEY).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: "--bundles app,dmg"
          - platform: windows-latest
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - run: npm ci

      - run: npm test

      - run: npm run typecheck

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/desktop
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Visink ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            Сборки для macOS (Apple Silicon, .dmg) и Windows (установщик .exe). Установленный Visink сам предложит обновиться при запуске.
            Сборки не подписаны: на macOS после установки выполните `xattr -cr /Applications/Visink.app`, на Windows в SmartScreen — «Подробнее» → «Выполнить в любом случае».
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
